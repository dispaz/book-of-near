# Book of NEAR Worker: the testnet faucet (issue #7) and the 1Click quote proxy (#24). Later: badge claim signer, exam grader.
# Secrets are NEVER in this file: see README.md (`wrangler secret put ...`).
name = "book-of-near-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Browser origins allowed to call the Worker (comma separated). http://localhost:<port> is allowed
# only when ALLOW_LOCALHOST=1 (set it in .dev.vars for local dev, never here).
ALLOWED_ORIGINS = "https://book-of-near.pages.dev"
# NEAR sent to each new practice account.
FAUCET_AMOUNT = "0.5"
# Rate limits: accounts per IP address per UTC day, and accounts per UTC day in total.
PER_IP_DAILY = "3"
GLOBAL_DAILY = "50"
# 1Click quotes (POST /intents/quote) per IP address per UTC day, and in total. Each quote writes two
# KV keys, so keep QUOTE_GLOBAL_DAILY low enough for the KV write quota.
QUOTE_PER_IP_DAILY = "20"
QUOTE_GLOBAL_DAILY = "400"
# Badge claims (POST /claim): the testnet badge contract (docs/badge-contract.md) and the claim limits per
# IP address, per account and in total per UTC day. The claim key itself is the secret CLAIM_SIGNING_KEY.
BADGE_CONTRACT_ID = "badges.bon-badges-mwe57oab.testnet"
CLAIM_PER_IP_DAILY = "20"
CLAIM_PER_ACCOUNT_DAILY = "10"
CLAIM_GLOBAL_DAILY = "500"

# Counters for the rate limits. Create the namespace once with
#   npx wrangler kv namespace create FAUCET_LIMITS
# and paste the id it prints here. `wrangler dev` uses a local simulation, so no id is needed there.
[[kv_namespaces]]
binding = "FAUCET_LIMITS"
id = "93922d03fecf43b091ed2f1e2e307cca"
