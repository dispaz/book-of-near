<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NEAR Ink Stage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,700;1,500&family=Caveat:wght@600&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: one full-height 3D stage (single deliberate look: ink outlines on pale paper, glowing orange-to-blue value), a title top-left, a floating stage bar at the bottom. */
:root{--ink:#16141f;--paper:#efeadd;--desk:#d8dfd6;--wood:#e9e1cf;--orange:#ff8a3d;--blue:#4d6bff;--pink:#ff5fa2;--glass:#ffffffcc;--mute:#5d5a68;--serif:"Newsreader",Georgia,serif;--hand:"Caveat",cursive;--ui:"DM Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);overflow:hidden}
#app{position:relative;height:100%;min-height:520px;overflow:hidden;background:linear-gradient(180deg,var(--wood) 0,var(--wood) 34%,var(--desk) 34.1%,#c9d2c8 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:600 15px var(--hand);font-size:21px;color:var(--ink);transform:translate(-50%,-50%);text-shadow:0 0 6px var(--paper),0 0 2px var(--paper)}
.lb.small{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lb.hint{font:700 12px var(--ui);background:var(--ink);color:#fff;padding:5px 10px;border-radius:999px;text-shadow:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{margin-top:-8px}}
#title{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));max-width:min(420px,calc(100% - 32px));pointer-events:none}
#title p{margin:0 0 4px;font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#title h1{margin:0;font:700 clamp(22px,4vw,32px)/1.1 var(--serif);text-wrap:balance}
#menu{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid var(--ink);border-radius:18px;padding:12px 16px}
#menu ol{margin:0;padding-left:22px;display:grid;gap:6px;font-family:var(--serif);font-size:16px}
#menu li{cursor:pointer}#menu li.on{font-weight:700}
#bar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 32px));display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:0 10px 24px #0003}
#bar button{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
#bar button:hover{background:#16141f14}
#bar button:disabled{opacity:.3;cursor:default}
#bar button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
#bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#cap{flex:1;min-width:0;font:500 clamp(14px,2.4vw,17px)/1.25 var(--serif);padding:0 6px}
#dots{display:flex;gap:6px;flex:none}
#dots i{width:9px;height:9px;border-radius:5px;background:#16141f33;cursor:pointer;transition:width .25s,background .25s}
#dots i.on{width:26px;background:var(--ink)}
#fallback{position:absolute;inset:0;background:var(--paper);padding:90px max(16px,env(safe-area-inset-left,0px)) 24px;font:500 17px/1.5 var(--serif)}
#fallback ol{max-width:60ch}
@media (max-width:560px){#dots{display:none}#bar{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){.lb.hint{animation:none}}
</style>

<div id="app">
  <canvas id="c" aria-label="3D diagram of a transaction moving between shards"></canvas>
  <div id="labels"></div>
  <div id="title"><p>Module 1 · Under the hood</p><h1>Follow a transaction</h1></div>
  <div id="menu" hidden><ol id="menuList"></ol></div>
  <div id="bar">
    <button id="bMenu" aria-label="Stages"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button id="bPrev" aria-label="Previous stage"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="bPlay" aria-label="Play"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
    <div id="cap" aria-live="polite"></div>
    <div id="dots"></div>
    <button id="bNext" aria-label="Next stage"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div id="fallback" hidden><p>Your browser can't draw the 3D scene. Here are the stages as text.</p><ol id="fbList"></ol></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const CAPS=[
 'Alice holds 10 NEAR and signs a transaction: send 5 NEAR to bob.near.',
 'Block N, shard 0: the transaction becomes a receipt. Alice prepays 0.1 NEAR for gas.',
 'Block N+1: the receipt crosses to Bob’s shard. Click a shard to choose where Bob lives.',
 'Bob’s shard runs the receipt. Bob now holds 5 NEAR. Only 0.04 NEAR of gas was used.',
 'Block N+2, shard 0: the unused gas returns to Alice as a refund receipt. About 2 seconds in all.'
];
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, SP=reduce?.25:1;
// text-only fallbacks and the stage list are built first so they work without WebGL
CAPS.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.onclick=()=>{go(i);$('menu').hidden=true};$('menuList').appendChild(li);
  const f=document.createElement('li');f.textContent=c;$('fbList').appendChild(f);
  const d=document.createElement('i');d.onclick=()=>go(i);$('dots').appendChild(d);});

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,alpha:true});}catch(e){renderer=null}
if(!renderer){$('fallback').hidden=false;}
else{
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=9;controls.maxDistance=32;controls.maxPolarAngle=1.38;controls.minPolarAngle=.35;
const INK=0x16141f;
const colX=[-4.2,0,4.2], rowZ=[-3.2,0,3.2];

function inkMat(color){return new THREE.ShaderMaterial({uniforms:{uColor:{value:new THREE.Color(color)},uDpr:{value:renderer.getPixelRatio()}},
 vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 uColor;uniform float uDpr;varying vec3 vN;void main(){float l=max(dot(normalize(vN),normalize(vec3(.35,.8,.45))),0.);float sh=.3+.7*l;float h=step(.55,fract((gl_FragCoord.x+gl_FragCoord.y)/(uDpr*5.)));vec3 c=uColor*(.58+.42*sh);if(sh<.62)c=mix(c,c*.42,h);gl_FragColor=vec4(c,1.);}'});}
function outline(mesh,thr){const l=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,thr||25),new THREE.LineBasicMaterial({color:INK}));mesh.add(l);return l;}
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();

// soft contact shadows
function shadowTex(){const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(64,32,4,64,32,62);
 r.addColorStop(0,'rgba(22,20,31,.38)');r.addColorStop(1,'rgba(22,20,31,0)');g.fillStyle=r;g.fillRect(0,0,128,64);return new THREE.CanvasTexture(c);}
const SH=shadowTex();
function shadow(x,z,w,d){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:SH,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.01,z);scene.add(m);return m;}

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshBasicMaterial({color:0xf3efe4}));ground.rotation.x=-Math.PI/2;scene.add(ground);

// shard slabs and block rings
const slabs=[],rings=[];
rowZ.forEach((z,r)=>{
  const geo=new THREE.BoxGeometry(12.6,.32,2.5);
  const s=new THREE.Mesh(geo,inkMat(0xe9e2d0));s.position.set(0,.16,z);s.userData.shard=r;outline(s);scene.add(s);slabs.push(s);
  shadow(.6,z+.5,15,4.2);
  rings[r]=colX.map(x=>{
    const m=new THREE.Mesh(new THREE.RingGeometry(.95,1.1,48),new THREE.MeshBasicMaterial({color:INK,side:THREE.DoubleSide,transparent:true,opacity:.7}));
    m.rotation.x=-Math.PI/2;m.position.set(x,.335,z);scene.add(m);
    const d=new THREE.Mesh(new THREE.CircleGeometry(.95,48),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,side:THREE.DoubleSide}));
    d.rotation.x=-Math.PI/2;d.position.set(x,.336,z);scene.add(d);
    return {ring:m,disc:d};
  });
});

// jars (glass + liquid)
function makeJar(color){
  const g=new THREE.Group();
  const glassGeo=new THREE.CylinderGeometry(.95,.95,2.4,36,1,true);
  const glass=new THREE.Mesh(glassGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));
  glass.position.y=1.2;g.add(glass);
  [0,2.4].forEach(y=>{const r=new THREE.Mesh(new THREE.RingGeometry(.9,.95,40),new THREE.MeshBasicMaterial({color:INK,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.y=y+.01;g.add(r);
    const r2=r.clone();r2.scale.set(1.04,1.04,1);r2.position.y=y+(y?.06:.03);g.add(r2);});
  [[.95,0],[-.95,0],[0,.95],[0,-.95]].forEach(([x,z])=>{const p=[new THREE.Vector3(x,0,z),new THREE.Vector3(x,2.4,z)];
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:INK})));});
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(.84,.84,1,36),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.92}));
  liq.position.y=.02;liq.scale.y=.001;g.add(liq);
  const lg=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));lg.scale.set(4,4,1);lg.position.y=1.2;g.add(lg);
  g.userData={liq,lg};scene.add(g);return g;
}
const alice=makeJar(0xff8a3d), bob=makeJar(0x4d6bff);
alice.position.set(colX[0],.33,rowZ[0]);
function setLevel(jar,v){const h=Math.max(.001,v/10*2.2);jar.userData.liq.scale.y=h;jar.userData.liq.position.y=h/2+.02;jar.userData.lg.material.opacity=v>0?Math.min(.5,.12+v*.05):0;}
let bobShard=2;
function placeBob(){bob.position.set(colX[1],.33,rowZ[bobShard]);}placeBob();
const shAlice=shadow(colX[0],rowZ[0]+.2,3,1.8);
const shBob=shadow(colX[1],rowZ[bobShard]+.2,3,1.8);

// token + trail
const tokMat=new THREE.MeshBasicMaterial({color:0xff8a3d});
const token=new THREE.Mesh(new THREE.SphereGeometry(.36,24,16),tokMat);token.visible=false;scene.add(token);
const tokGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xff8a3d,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));tokGlow.scale.set(2.6,2.6,1);token.add(tokGlow);
const trail=[];for(let i=0;i<14;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xff8a3d,transparent:true,opacity:.5*(1-i/14),blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.setScalar(1.5*(1-i/18));s.visible=false;scene.add(s);trail.push(s);}
const COL={orange:0xff8a3d,blue:0x4d6bff,pink:0xff5fa2};
function tint(c){tokMat.color.setHex(c);tokGlow.material.color.setHex(c);trail.forEach(t=>t.material.color.setHex(c));}
function ringPos(c,r,y){return new THREE.Vector3(colX[c],y===undefined?.75:y,rowZ[r]);}

// html labels that follow 3D points
const labels=[];
function lbl(text,cls,getPos){const e=document.createElement('div');e.className='lb '+(cls||'');e.textContent=text;$('labels').appendChild(e);const o={e,getPos};labels.push(o);return o;}
rowZ.forEach((z,r)=>lbl('Shard '+r,'small',()=>new THREE.Vector3(-7.4,.3,z)));
colX.forEach((x,c)=>lbl(['Block N','Block N+1','Block N+2'][c],'small',()=>new THREE.Vector3(x,.3,-5.0)));
let aliceBal=10,bobBal=0;
const aliceL=lbl('','',()=>new THREE.Vector3(colX[0],3.4,rowZ[0]));
const bobL=lbl('','',()=>new THREE.Vector3(colX[1],3.4,rowZ[bobShard]));
function updText(){aliceL.e.textContent='Alice · '+(+aliceBal.toFixed(2))+' NEAR';bobL.e.textContent='bob.near · '+(+bobBal.toFixed(2))+' NEAR';}
const hints=[1,2].map(r=>{const h=lbl('Click to send Bob here','hint',()=>new THREE.Vector3(colX[1]+2.6,1.4,rowZ[r]));h.e.style.display='none';return h;});

// tweens
const tweens=[];let runId=0;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function tween(dur,fn,id){return new Promise(res=>{tweens.push({t0:performance.now(),dur:dur*1000*SP,fn,res,id});});}
function stepTweens(now){for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];
  if(t.id!==runId){tweens.splice(i,1);continue;}
  const u=Math.min(1,(now-t.t0)/Math.max(1,t.dur));t.fn(ease(u));if(u>=1){tweens.splice(i,1);t.res();}}}

// state
function setRing(c,r,color){const o=rings[r][c];o.disc.material.color.setHex(color);o.disc.material.opacity=.55;o.ring.material.opacity=1;}
function clearRings(){rings.forEach(row=>row.forEach(o=>{o.disc.material.opacity=0;o.ring.material.opacity=.7;}));}
function setTok(pos,color,scale){if(!pos){token.visible=false;trail.forEach(t=>t.visible=false);return;}token.visible=true;token.position.copy(pos);token.scale.setScalar(scale||1);tint(color);trail.forEach(t=>{t.visible=true;t.position.copy(pos);});}
function applyState(i){
  clearRings();bobShard=bobShard;placeBob();shBob.position.set(colX[1],.01,rowZ[bobShard]+.2);
  aliceBal=[10,4.9,4.9,4.9,4.96][i];bobBal=i>=3?5:0;setLevel(alice,aliceBal);setLevel(bob,bobBal);updText();
  if(i>=1)setRing(0,0,COL.orange);
  if(i>=2)setRing(1,bobShard,COL.blue);
  if(i>=4)setRing(2,0,COL.pink);
  if(i===1)setTok(ringPos(0,0),COL.orange);
  else if(i===2)setTok(ringPos(1,bobShard),COL.blue);
  else if(i===4)setTok(ringPos(2,0),COL.pink);
  else setTok(null);
}
function arc(from,to,h,id,dur,onU){const a=from.clone(),b=to.clone();return tween(dur,u=>{token.position.lerpVectors(a,b,u);token.position.y+=Math.sin(u*Math.PI)*h;onU&&onU(u);},id);}

const camStages=[
 {p:[-1,7.5,14.5],t:[-3,1,-1.5]},
 {p:[-9,6.5,6],t:[-3,.8,-3]},
 {p:[2,11,16],t:[0,.5,0]},
 {p:[8,6.5,13],t:[0,1.2,1.6]},
 {p:[7,9,6],t:[1,.8,-1]}
];
const camP=new THREE.Vector3(),camT=new THREE.Vector3();let userMoved=false;
controls.addEventListener('start',()=>userMoved=true);

let stage=0,playing=false,timer=null;
async function enter(i){
  const id=++runId;clearTimeout(timer);
  applyState(i>0?i-1:0);if(i===0)applyState(0);
  hints.forEach(h=>h.e.style.display='none');
  if(i===0){alice.userData.lg.material.opacity=.5;}
  else if(i===1){
    const start=ringPos(0,0,3.4);setTok(start,COL.orange,.01);setRing(0,0,COL.orange);
    await Promise.all([tween(.9,u=>{token.position.lerpVectors(start,ringPos(0,0),u);token.scale.setScalar(.01+.99*u);},id),
      tween(1.1,u=>{aliceBal=10-5.1*u;setLevel(alice,aliceBal);updText();},id)]);
  }else if(i===2){
    hints.forEach(h=>h.e.style.display='');
    const a=ringPos(0,0),b=ringPos(1,bobShard);tint(COL.blue);setRing(1,bobShard,COL.blue);
    await arc(a,b,3.2,id,1.4);
  }else if(i===3){
    const p=ringPos(1,bobShard);
    await Promise.all([tween(.9,u=>{token.scale.setScalar(1-u*.95);token.position.set(p.x,p.y+u*1.2,p.z);},id),
      tween(1.3,u=>{bobBal=5*u;setLevel(bob,bobBal);updText();},id)]);
    if(id===runId)setTok(null);
  }else if(i===4){
    const a=ringPos(1,bobShard),b=ringPos(2,0);setTok(a,COL.pink,.6);setRing(2,0,COL.pink);
    await Promise.all([arc(a,b,3.2,id,1.5),tween(1.5,u=>{aliceBal=4.9+.06*u;setLevel(alice,aliceBal);updText();},id)]);
  }
  if(id!==runId)return;
  if(playing){if(stage<CAPS.length-1)timer=setTimeout(()=>go(stage+1),2200*SP);else setPlaying(false);}
}
function go(i){
  stage=Math.max(0,Math.min(CAPS.length-1,i));
  $('cap').textContent=CAPS[stage];
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===stage));
  [...$('menuList').children].forEach((d,k)=>d.classList.toggle('on',k===stage));
  $('bPrev').disabled=stage===0;$('bNext').disabled=stage===CAPS.length-1;
  camP.set(...camStages[stage].p);camT.set(...camStages[stage].t);userMoved=false;
  enter(stage);
}
function setPlaying(p){playing=p;$('bPlay').setAttribute('aria-label',p?'Pause':'Play');
  $('icoPlay').innerHTML=p?'<path d="M8 5v14M16 5v14" stroke-width="3"/>':'<path d="M8 5l11 7-11 7z" fill="currentColor"/>';}
$('bPlay').onclick=()=>{if(playing){setPlaying(false);clearTimeout(timer);}else{setPlaying(true);if(stage===CAPS.length-1)go(0);else go(stage+1);}};
$('bNext').onclick=()=>{setPlaying(false);go(stage+1);};
$('bPrev').onclick=()=>{setPlaying(false);go(stage-1);};
$('bMenu').onclick=()=>{$('menu').hidden=!$('menu').hidden;};

// click a shard in stage 2 to move Bob there
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||stage!==2)return;
  const r=renderer.domElement.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);const hit=ray.intersectObjects(slabs)[0];
  if(hit&&hit.object.userData.shard>0&&hit.object.userData.shard!==bobShard){bobShard=hit.object.userData.shard;enter(2);}
});

function resize(){const w=$('app').clientWidth,h=$('app').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const narrow=w<700;camera.fov=narrow?48:34;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe($('app'));resize();

camera.position.set(-1,7.5,14.5);controls.target.set(-3,1,-1.5);camP.copy(camera.position);camT.copy(controls.target);
const v=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  stepTweens(now);
  if(!userMoved){camera.position.lerp(camP,.045);controls.target.lerp(camT,.045);}
  controls.update();
  // trail follows token
  if(token.visible){trail[0].position.lerp(token.position,.5);for(let i=1;i<trail.length;i++)trail[i].position.lerp(trail[i-1].position,.35);}
  token.children[0].material.opacity=.75+.25*Math.sin(now/180);
  renderer.render(scene,camera);
  const w=$('app').clientWidth,h=$('app').clientHeight;
  labels.forEach(o=>{v.copy(o.getPos()).project(camera);const behind=v.z>1;o.e.style.visibility=behind?'hidden':'visible';
    o.e.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-50%)`;});
}
requestAnimationFrame(frame);
go(0);
}
</script>

</body></html>
